swagger: "2.0"
info: {}
basePath: /v1
paths:
  /properties/:
    get:
      tags:
      - properties
      description: |-
        List properties with optional AND filters, amenities OR filter, and limit
        <br>
      operationId: PropertyController.Get property list
      parameters:
      - in: query
        name: min_price
        description: Minimum price (usd_price >= min_price)
        type: number
        format: double
      - in: query
        name: max_price
        description: Maximum price (usd_price <= max_price)
        type: number
        format: double
      - in: query
        name: min_star_rating
        description: Minimum star rating
        type: integer
        format: int64
      - in: query
        name: min_review_score
        description: Minimum review score
        type: number
        format: double
      - in: query
        name: min_reviews
        description: Minimum number of reviews
        type: integer
        format: int64
      - in: query
        name: published
        description: Published status (true or false)
        type: boolean
      - in: query
        name: property_type
        description: 'Exact match: Hotel, House, Apartment, Villa, Resort, Hostel'
        type: string
      - in: query
        name: feed
        description: 'Exact match: 11, 12, 22, or 24'
        type: integer
        format: int64
      - in: query
        name: min_bedroom
        description: Minimum bedroom count
        type: integer
        format: int64
      - in: query
        name: amenities
        description: Comma-separated list, OR match, e.g. Internet,Parking
        type: string
      - in: query
        name: limit
        description: Cap number of results returned
        type: integer
        format: int64
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.ListResponse'
        "400":
          description: '{object} models.ErrorResponse "invalid query parameter"'
  /properties/{id}:
    get:
      tags:
      - properties
      description: |-
        Return a single transformed property object
        <br>
      operationId: PropertyController.Get property by ID
      parameters:
      - in: path
        name: id
        description: Property ID, e.g. BC-1000001
        required: true
        type: string
      responses:
        "200":
          description: ""
          schema:
            $ref: '#/definitions/models.PropertyResponse'
        "404":
          description: '{object} models.ErrorResponse "property not found"'
definitions:
  models.Counts:
    title: Counts
    type: object
    properties:
      Bathroom:
        type: integer
        format: int64
      Bedroom:
        type: integer
        format: int64
      Occupancy:
        type: integer
        format: int64
      Reviews:
        type: integer
        format: int64
  models.GeoInfo:
    title: GeoInfo
    type: object
    properties:
      Breadcrumbs:
        type: array
        items:
          type: string
      City:
        type: string
      Country:
        type: string
      CountryCode:
        type: string
      Lat:
        type: number
        format: double
      LocationID:
        type: string
      Lon:
        type: number
        format: double
      Name:
        type: string
      State:
        type: string
      StateAbbr:
        type: string
  models.Image:
    title: Image
    type: object
    properties:
      Count:
        type: integer
        format: int64
      Images:
        type: array
        items:
          type: string
  models.ListResponse:
    title: ListResponse
    type: object
    properties:
      Result:
        $ref: '#/definitions/models.ListResult'
  models.ListResult:
    title: ListResult
    type: object
    properties:
      Count:
        type: integer
        format: int64
      Items:
        type: array
        items:
          $ref: '#/definitions/models.PropertyResponse'
  models.PropertyInfo:
    title: PropertyInfo
    type: object
    properties:
      Amenities:
        type: array
        items:
          type: string
      Counts:
        $ref: '#/definitions/models.Counts'
      Image:
        $ref: '#/definitions/models.Image'
      Name:
        type: string
      Price:
        type: number
        format: double
      PropertyType:
        type: string
      ReviewScore:
        type: number
        format: double
      Slug:
        type: string
      StarRating:
        type: integer
        format: int64
  models.PropertyResponse:
    title: PropertyResponse
    type: object
    properties:
      Feed:
        type: integer
        format: int64
      GeoInfo:
        $ref: '#/definitions/models.GeoInfo'
        description: its a strcuture
      ID:
        type: string
      Property:
        $ref: '#/definitions/models.PropertyInfo'
        description: its a strcuture
      Published:
        description: its a strcuture
        type: boolean
